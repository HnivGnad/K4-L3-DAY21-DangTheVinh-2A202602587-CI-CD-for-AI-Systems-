name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.dvc'
      - '.dvc/config'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'params.yaml'
      - 'requirements.txt'
      - 'requirements-serving.txt'
      - 'deploy/**'
      - '.github/workflows/cicd.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: income-model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  train:
    name: Train
    if: github.event_name != 'pull_request'
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    env:
      ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Authenticate to AWS
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json, os
          credentials = json.loads(os.environ['STORAGE_CREDENTIALS'])
          names = {'aws_access_key_id': 'AWS_ACCESS_KEY_ID',
                   'aws_secret_access_key': 'AWS_SECRET_ACCESS_KEY',
                   'aws_session_token': 'AWS_SESSION_TOKEN'}
          for required in ('aws_access_key_id', 'aws_secret_access_key'):
              if not credentials.get(required):
                  raise SystemExit(f'Missing credential field: {required}')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              for key, name in names.items():
                  if credentials.get(key):
                      value = credentials[key]
                      if '\n' in value or '\r' in value:
                          raise SystemExit('Invalid credential value')
                      print(f'::add-mask::{value}')
                      stream.write(f'{name}={value}\n')
          PYEOF
      - name: Pull training data
        run: |
          dvc remote modify --local labstore url "s3://${ARTIFACT_BUCKET}/dvc"
          dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          python - <<'PYEOF'
          import json, os
          with open('outputs/report.json') as stream:
              f1 = json.load(stream)['f1_score']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'f1={f1}\n')
          PYEOF
      - name: Stage candidate model in S3
        run: |
          python - <<'PYEOF'
          import boto3, os
          client = boto3.client('s3')
          prefix = f"artifacts/runs/{os.environ['GITHUB_RUN_ID']}/{os.environ['GITHUB_RUN_ATTEMPT']}"
          for local, name in [('models/model.joblib', 'model.joblib'), ('outputs/report.json', 'report.json')]:
              client.upload_file(local, os.environ['ARTIFACT_BUCKET'], f'{prefix}/{name}')
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check positive-class F1
        env:
          MODEL_F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import math, os
          f1 = float(os.environ['MODEL_F1'])
          if not math.isfinite(f1) or not 0.65 <= f1 <= 1.0:
              raise SystemExit(f'FAILED: f1_score {f1} does not meet threshold 0.65. Release blocked.')
          print(f'PASSED: f1_score {f1:.4f} >= 0.65')
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to AWS
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json, os
          credentials = json.loads(os.environ['STORAGE_CREDENTIALS'])
          names = {'aws_access_key_id': 'AWS_ACCESS_KEY_ID',
                   'aws_secret_access_key': 'AWS_SECRET_ACCESS_KEY',
                   'aws_session_token': 'AWS_SESSION_TOKEN'}
          for required in ('aws_access_key_id', 'aws_secret_access_key'):
              if not credentials.get(required):
                  raise SystemExit(f'Missing credential field: {required}')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              for key, name in names.items():
                  if credentials.get(key):
                      value = credentials[key]
                      if '\n' in value or '\r' in value:
                          raise SystemExit('Invalid credential value')
                      print(f'::add-mask::{value}')
                      stream.write(f'{name}={value}\n')
          PYEOF
      - name: Allow runner SSH temporarily
        id: open_ssh
        env:
          SG_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
        run: |
          RUNNER_IP=$(curl -4 -fsS https://checkip.amazonaws.com)
          RULE_ID=$(aws ec2 authorize-security-group-ingress --group-id "$SG_ID" --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" --query 'SecurityGroupRules[0].SecurityGroupRuleId' --output text)
          echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"
      - name: Copy serving files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "src/serve.py,requirements-serving.txt,deploy/income-api.service"
          target: /home/${{ secrets.SERVER_USER }}/income-api
      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          MODEL_RUN_ID: ${{ github.run_id }}
          MODEL_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: ARTIFACT_BUCKET,AWS_DEFAULT_REGION,MODEL_RUN_ID,MODEL_RUN_ATTEMPT
          script: |
            set -eu
            cd "$HOME/income-api"
            .venv/bin/python -m pip install -r requirements-serving.txt
            sudo install -m 644 deploy/income-api.service /etc/systemd/system/income-api.service
            sudo systemctl daemon-reload
            "$HOME/income-api/.venv/bin/python" - <<'PYEOF'
            import boto3, os
            client = boto3.client('s3')
            bucket = os.environ['ARTIFACT_BUCKET']
            prefix = f"artifacts/runs/{os.environ['MODEL_RUN_ID']}/{os.environ['MODEL_RUN_ATTEMPT']}"
            for name in ('model.joblib', 'report.json'):
                client.copy_object(Bucket=bucket, Key=f'artifacts/current/{name}',
                                   CopySource={'Bucket': bucket, 'Key': f'{prefix}/{name}'})
            PYEOF
            sudo systemctl restart income-api
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --max-time 5 http://localhost:8080/healthz; then
                echo 'Health check passed.'
                exit 0
              fi
              sleep 5
            done
            sudo journalctl -u income-api -n 30 --no-pager
            echo 'Health check failed.'
            exit 1
      - name: Close runner SSH rule
        if: always() && steps.open_ssh.outputs.rule_id != ''
        env:
          SG_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
          RULE_ID: ${{ steps.open_ssh.outputs.rule_id }}
        run: aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --security-group-rule-ids "$RULE_ID"
